<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Visión 🚀</title>
    <style>
        body { background-color: #000; color: #FFD700; font-family: sans-serif; text-align: center; padding: 50px; }
        .box { border: 2px solid #FFD700; border-radius: 20px; padding: 30px; box-shadow: 0 0 20px #FFD700; background: #111; }
        h1 { font-size: 2.5em; letter-spacing: 4px; margin-bottom: 10px; }
        p { color: white; font-size: 1.1em; }
        .btn { display: inline-block; background: #FFD700; color: black; padding: 15px 30px; border-radius: 50px; text-decoration: none; font-weight: bold; margin-top: 25px; box-shadow: 0 4px 10px rgba(255, 215, 0, 0.3); }
        .status { color: #00FF00; font-size: 0.8em; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>APP VISIÓN</h1>
        <p>Streaming, Batallas PK y Entretenimiento</p>
        <hr style="border: 0.5px solid #333; width: 60%;">
        <div class="status">● SISTEMA CONECTADO Y SEGURO</div>
        <a href="#" class="btn">ENTRAR A LA EXPERIENCIA</a>
    </div>
</body>
</html>
