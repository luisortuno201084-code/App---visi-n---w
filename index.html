<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Visión 🚀</title>
    <style>
        body { background-color: #000; color: #FFD700; font-family: sans-serif; text-align: center; padding: 10px; }
        .box { border: 2px solid #FFD700; border-radius: 20px; padding: 15px; background: #111; }
        .bag { margin-top: 20px; text-align: left; background: #222; padding: 10px; border-radius: 10px; }
        .gift-item { display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid #333; font-size: 0.9em; }
        .vip { color: #00FF00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>APP VISIÓN</h1>
        <p>Streaming & Batallas PK</p>
        
        <div class="bag">
            <h3>🎁 Bolsa de Regalos</h3>
            <div class="gift-item"><span>⭐ Estrella</span> <span>10 pts</span></div>
            <div class="gift-item"><span>❤️ Corazón</span> <span>20 pts</span></div>
            <div class="gift-item"><span>👑 Corona</span> <span>50 pts</span></div>
            <div class="gift-item"><span>💎 Diamante</span> <span>250 pts</span></div>
            <div class="gift-item" style="color:cyan"><span>🌞 App Visión</span> <span>10,000 pts</span></div>
        </div>
    </div>
</body>
</html>
